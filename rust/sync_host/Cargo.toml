[package]
name = "mangayomi_sync_host"
version = "0.1.0"
edition = "2021"
description = "Mutual-TLS sync host and client for Mangayomi devices and its sync server."
publish = false

[dependencies]
anyhow = "1.0.104"
# Pinned to what reqwest 0.13 already resolves, so a build has one rustls.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
aws-lc-rs = "1"
tokio = { version = "1.50.0", features = ["full"] }
tokio-util = "0.7.16"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
futures-util = "0.3.31"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "stream"] }

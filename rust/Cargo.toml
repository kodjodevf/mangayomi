[package]
name = "rust_lib_mangayomi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = { version = "=2.13.0", features = ["chrono"] }
chrono = "0.4.44"
futures-util = "0.3.31"
reqwest = { version = "0.13.2", default-features = false, features = ["charset", "http2", "rustls", "stream", "multipart", "socks", "brotli", "gzip"] }
tokio = { version = "1.50.0", features = ["full"] }
tokio-util = "0.7.16"
epub = "2.1.5"
zip = "8.5.0"
rars = "0.9.3"
libc = "0.2"
# Pinned to what reqwest 0.13 already resolves, so the build has one rustls.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
webpki-roots = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
